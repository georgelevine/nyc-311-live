services:
  - type: web
    name: nyc-311-live-web
    runtime: node
    plan: starter
    buildCommand: npm ci
    preDeployCommand: npm run cloud:migrate
    startCommand: npm run cloud:web
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: nyc-311-live-db
          property: connectionString
      - key: DASHBOARD_USERNAME
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false

  - type: worker
    name: nyc-311-live-collector
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run cloud:worker
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: nyc-311-live-db
          property: connectionString
      - key: POLL_INTERVAL_SECONDS
        value: 15
      - key: AUDIT_DELAY_MINUTES
        value: 35
      - key: DETAIL_REQUEST_DELAY_MS
        value: 750
      - key: AUDIT_REQUEST_DELAY_MS
        value: 750

databases:
  - name: nyc-311-live-db
    plan: basic-256mb
    ipAllowList: []
