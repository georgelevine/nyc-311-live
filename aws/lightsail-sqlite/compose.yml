name: ${COMPOSE_PROJECT_NAME:-nyc311}

x-app-image: &app-image
  image: nyc-311-sqlite:${IMAGE_TAG:-local}
  build:
    context: ../..
    dockerfile: Dockerfile.sqlite
    args:
      APP_VERSION: ${IMAGE_TAG:-local}

x-app-runtime: &app-runtime
  init: true
  read_only: true
  user: "10001:10001"
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_PATH: /data/portal-archive.sqlite
  SQLITE_SYNCHRONOUS: ${SQLITE_SYNCHRONOUS:-FULL}
  SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS:-30000}

x-data-volume: &data-volume
  type: bind
  source: /var/lib/nyc-311-live
  target: /data

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  collector:
    <<: [*app-image, *app-runtime]
    command: ["flock", "--nonblock", "--no-fork", "/locks/collector.lock", "node", "live-311.js"]
    restart: unless-stopped
    environment:
      <<: *app-environment
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-15}
      AUDIT_DELAY_MINUTES: ${AUDIT_DELAY_MINUTES:-35}
      DETAIL_REQUEST_DELAY_MS: ${DETAIL_REQUEST_DELAY_MS:-2500}
      AUDIT_MAX_PARALLEL: ${AUDIT_MAX_PARALLEL:-2}
      AUDIT_REQUEST_DELAY_MS: ${AUDIT_REQUEST_DELAY_MS:-500}
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-track.opendata.support}
      EMAIL_SUBSCRIBE_BID_IDS: ${EMAIL_SUBSCRIBE_BID_IDS:-}
      EMAIL_SUBSCRIBE_PRECINCTS: ${EMAIL_SUBSCRIBE_PRECINCTS:-}
      EMAIL_PRECINCT_START_AT: ${EMAIL_PRECINCT_START_AT:-}
      EMAIL_SUBSCRIBE_ALL_NEW: ${EMAIL_SUBSCRIBE_ALL_NEW:-0}
      EMAIL_ALL_START_AT: ${EMAIL_ALL_START_AT:-}
      EMAIL_SUBSCRIPTION_DELAY_MS: ${EMAIL_SUBSCRIPTION_DELAY_MS:-5000}
      EMAIL_SUBSCRIPTION_WORKERS: ${EMAIL_SUBSCRIPTION_WORKERS:-3}
      INITIAL_EMAIL_ENDPOINT: ${INITIAL_EMAIL_ENDPOINT:-}
      INBOUND_EMAIL_WEBHOOK_SECRET: ${INBOUND_EMAIL_WEBHOOK_SECRET:-}
      SCHEDULED_OPEN_FOLLOWUPS_ENABLED: ${SCHEDULED_OPEN_FOLLOWUPS_ENABLED:-1}
    volumes:
      - *data-volume
      - type: bind
        source: /var/lib/nyc-311-live-lock/collector.lock
        target: /locks/collector.lock
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const {DatabaseSync}=require('node:sqlite');const d=new DatabaseSync(process.env.DATABASE_PATH,{readOnly:true});const r=d.prepare(\"SELECT value FROM live_monitor_state WHERE key='last_successful_poll_at'\").get();d.close();const a=Date.now()-Date.parse(r&&r.value);process.exit(Number.isFinite(a)&&a>=-60000&&a<=300000?0:1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 90s
    logging: *default-logging

  web:
    <<: [*app-image, *app-runtime]
    command: ["node", "server.js"]
    restart: unless-stopped
    environment:
      <<: *app-environment
      HOST: 0.0.0.0
      PORT: "10000"
      REQUIRE_DASHBOARD_AUTH: "1"
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in aws/lightsail-sqlite/.env}
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-track.opendata.support}
      INBOUND_EMAIL_WEBHOOK_SECRET: ${INBOUND_EMAIL_WEBHOOK_SECRET:-}
    volumes:
      - *data-volume
    expose:
      - "10000"
    ports:
      - "127.0.0.1:10000:10000"
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:10000/api/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s
    logging: *default-logging

  inbound-email:
    <<: [*app-image, *app-runtime]
    command: ["node", "inbound-email-server.js"]
    restart: unless-stopped
    environment:
      <<: *app-environment
      HOST: 0.0.0.0
      PORT: "10001"
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-track.opendata.support}
      INBOUND_EMAIL_WEBHOOK_SECRET: ${INBOUND_EMAIL_WEBHOOK_SECRET:-}
    volumes:
      - *data-volume
    expose:
      - "10001"
    ports:
      - "127.0.0.1:10001:10001"
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:10001/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 45s
    logging: *default-logging

  backup:
    <<: [*app-image, *app-runtime]
    profiles: [tools]
    command:
      - ionice
      - -c
      - "3"
      - nice
      - -n
      - "19"
      - flock
      - --nonblock
      - --no-fork
      - /backups/backup.lock
      - node
      - backup-sqlite.js
      - --db
      - /data/portal-archive.sqlite
      - --directory
      - /backups
      - --retain
      - ${BACKUP_RETENTION_COUNT:-3}
      # `flock` above makes it safe for the routine to remove every abandoned
      # partial from an interrupted earlier run before taking a new snapshot.
      - --exclusive
    restart: "no"
    volumes:
      - type: bind
        source: /var/lib/nyc-311-live
        target: /data
        read_only: true
      - type: bind
        source: /var/backups/nyc-311-live
        target: /backups
    # Lightsail's root filesystem is on /dev/nvme0n1p1, whose parent block
    # device is /dev/nvme0n1. Its active "none" I/O scheduler does not honor
    # ionice priorities, and cgroup v2 rejects a limit on the partition itself,
    # so enforce the bandwidth ceiling on the parent device.
    blkio_config:
      device_read_bps:
        - path: /dev/nvme0n1
          rate: 1mb
      device_write_bps:
        - path: /dev/nvme0n1
          rate: 1mb
    network_mode: none
    logging: *default-logging

  verify:
    <<: [*app-image, *app-runtime]
    user: "0:0"
    profiles: [tools]
    command:
      - node
      - verify-sqlite-snapshot.js
      - /imports/${SQLITE_IMPORT_FILE:-portal-archive.sqlite}
      - /imports/${SQLITE_IMPORT_FILE:-portal-archive.sqlite}.manifest.json
    restart: "no"
    volumes:
      - type: bind
        source: /var/lib/nyc-311-live-imports
        target: /imports
        read_only: true
      - type: bind
        source: /var/lib/nyc-311-live
        target: /data
        read_only: true
    network_mode: none
    logging: *default-logging

  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.invalid}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ../../public
        target: /srv/public
        read_only: true
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
    depends_on:
      web:
        condition: service_healthy
      inbound-email:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *default-logging

networks:
  app:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
