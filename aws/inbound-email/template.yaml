AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Receives NYC311 notification email for a dedicated subdomain, retains the
  original MIME message in S3, and forwards the exact bytes to an HTTPS webhook.

Parameters:
  RecipientDomain:
    Type: String
    Default: track.opendata.support
    Description: Dedicated inbound domain. The receipt rule accepts every local part.
    AllowedPattern: '^[A-Za-z0-9](?:[A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$'

  ReceiptRuleSetName:
    Type: String
    Default: nyc311-inbound
    Description: >
      SES receipt rule set to create. CloudFormation does not activate receipt
      rule sets; see the activation step in README.md.
    AllowedPattern: '^[A-Za-z0-9](?:[A-Za-z0-9_-]{0,62}[A-Za-z0-9])?$'

  ReceiptRuleName:
    Type: String
    Default: track-opendata-support
    AllowedPattern: '^[A-Za-z0-9](?:[A-Za-z0-9_.-]{0,62}[A-Za-z0-9])?$'

  ObjectKeyPrefix:
    Type: String
    Default: raw/
    Description: S3 prefix for retained MIME messages. Include a trailing slash.
    AllowedPattern: '^(?:[A-Za-z0-9!_.*''()/=-]+/)?$'

  RawEmailRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 3650
    Description: Days to retain current and noncurrent raw-message objects.

  WebhookUrl:
    Type: String
    Default: https://311.georgelevine.com/api/inbound/nyc311-email
    Description: Public HTTPS endpoint that accepts message/rfc822 request bodies.
    AllowedPattern: '^https://.+$'
    ConstraintDescription: Must be an HTTPS URL.

  WebhookSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    MaxLength: 256
    Description: >
      Shared HMAC secret configured identically on the webhook receiver. Use at
      least 32 random bytes; do not commit it to source control.

  ForwardToEmail:
    Type: String
    Default: georgealevine@gmail.com
    Description: Primary address that receives all monitored request emails.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

  HudsonForwardToEmail:
    Type: String
    Default: sean.m.lewin@gmail.com
    Description: Additional address that receives Hudson Square BID request emails.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

  ForwardPilotMinSuffix:
    Type: Number
    Default: 28334803
    Description: Lowest numeric SR suffix included in the forwarding pilot.

  ForwardPilotMaxSuffix:
    Type: Number
    Default: 28334842
    Description: Highest numeric SR suffix included in the forwarding pilot.

Resources:
  InboundDomainIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref RecipientDomain
      Tags:
        - Key: Purpose
          Value: NYC311 inbound notifications

  RawEmailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawMessages
            Status: Enabled
            ExpirationInDays: !Ref RawEmailRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref RawEmailRetentionDays
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  RawEmailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawEmailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSesToStoreReceivedEmail
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${RawEmailBucket.Arn}/${ObjectKeyPrefix}*'
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${ReceiptRuleSetName}:receipt-rule/${ReceiptRuleName}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt RawEmailBucket.Arn
              - !Sub '${RawEmailBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  FailedDeliveryQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  DeliveryLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: ReadRawEmailAndReportFailures
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadRawEmail
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${RawEmailBucket.Arn}/${ObjectKeyPrefix}*'
              - Sid: SendFailedInvocation
                Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt FailedDeliveryQueue.Arn
              - Sid: ForwardPilotUpdates
                Effect: Allow
                Action:
                  - ses:SendEmail
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${RecipientDomain}'
                  - !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${ForwardToEmail}'
                  - !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${HudsonForwardToEmail}'
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  DeliveryLambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: Sends retained NYC311 MIME messages to the Lightsail webhook.
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt DeliveryLambdaRole.Arn
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          RAW_EMAIL_BUCKET: !Ref RawEmailBucket
          RAW_EMAIL_PREFIX: !Ref ObjectKeyPrefix
          WEBHOOK_URL: !Ref WebhookUrl
          WEBHOOK_SECRET: !Ref WebhookSecret
          FORWARD_TO_EMAIL: !Ref ForwardToEmail
          HUDSON_FORWARD_TO_EMAIL: !Ref HudsonForwardToEmail
          FORWARD_DOMAIN: !Ref RecipientDomain
          FORWARD_PILOT_MIN_SUFFIX: !Ref ForwardPilotMinSuffix
          FORWARD_PILOT_MAX_SUFFIX: !Ref ForwardPilotMaxSuffix
      Code:
        ZipFile: |
          const crypto = require("node:crypto");
          const {
            GetObjectCommand,
            S3Client,
          } = require("@aws-sdk/client-s3");
          const {
            SESv2Client,
            SendEmailCommand,
          } = require("@aws-sdk/client-sesv2");

          const s3 = new S3Client({});
          const ses = new SESv2Client({});

          function requireEnvironment(name) {
            const value = process.env[name];
            if (!value) {
              throw new Error(`Missing required environment variable: ${name}`);
            }
            return value;
          }

          function verdicts(receipt = {}) {
            const names = [
              "spamVerdict",
              "virusVerdict",
              "spfVerdict",
              "dkimVerdict",
              "dmarcVerdict",
            ];
            return Object.fromEntries(
              names
                .filter((name) => receipt[name] && receipt[name].status)
                .map((name) => [name, receipt[name].status]),
            );
          }

          function cleanHeader(value, fallback = "") {
            const cleaned = String(value || "")
              .replace(/[\r\n]+/g, " ")
              .trim();
            return cleaned || fallback;
          }

          const easternDateTime = new Intl.DateTimeFormat("en-US", {
            timeZone: "America/New_York",
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
            timeZoneName: "short",
          });

          function formatEastern(value) {
            if (!value) return "";
            const parsed = new Date(value);
            return Number.isFinite(parsed.getTime())
              ? easternDateTime.format(parsed)
              : cleanHeader(value);
          }

          function escapeHtml(value) {
            return String(value || "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#39;");
          }

          function detailRow(label, value) {
            if (!value) return "";
            return `<tr>
              <td style="padding:8px 12px 8px 0;color:#6b7a90;font-size:13px;vertical-align:top;white-space:nowrap">${escapeHtml(label)}</td>
              <td style="padding:8px 0;color:#172638;font-size:14px;font-weight:600;vertical-align:top">${escapeHtml(value)}</td>
            </tr>`;
          }

          function emailShell({
            eyebrow,
            status,
            srnumber,
            title,
            subtitle,
            rows,
            sectionTitle,
            sectionBody,
            nextUpdate,
            portalUrl,
          }) {
            const statusText = cleanHeader(status, "NYC311");
            const closed = /closed|resolved/i.test(statusText);
            const badgeColor = closed ? "#087f5b" : "#1769e0";
            const response = sectionBody
              ? `<div style="margin-top:22px;padding:18px;background:#f4f7fb;border-radius:12px">
                  <div style="font-size:12px;line-height:1.4;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6b7a90">${escapeHtml(sectionTitle || "NYC311 response")}</div>
                  <div style="margin-top:8px;font-size:15px;line-height:1.55;color:#26384d">${escapeHtml(sectionBody).replace(/\n/g, "<br>")}</div>
                </div>`
              : "";
            const next = nextUpdate
              ? `<div style="margin-top:14px;padding:12px 14px;border-left:4px solid #f59f00;background:#fff8e6;color:#664d03;font-size:14px;line-height:1.45"><strong>Next update:</strong> ${escapeHtml(nextUpdate)}</div>`
              : "";
            const button = portalUrl
              ? `<div style="margin-top:24px"><a href="${escapeHtml(portalUrl)}" style="display:inline-block;padding:12px 18px;border-radius:9px;background:#1769e0;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700">View on NYC311</a></div>`
              : "";
            return `<!doctype html>
            <html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"></head>
            <body style="margin:0;padding:0;background:#eef3f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
              <div style="display:none;max-height:0;overflow:hidden">${escapeHtml(title)} · ${escapeHtml(srnumber)}</div>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef3f8"><tr><td align="center" style="padding:20px 12px">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #dbe4ee;border-radius:16px;overflow:hidden">
                  <tr><td style="height:7px;background:#1769e0"></td></tr>
                  <tr><td style="padding:26px 24px 28px">
                    <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6b7a90">${escapeHtml(eyebrow)}</div>
                    <div style="margin-top:13px"><span style="display:inline-block;padding:6px 10px;border-radius:999px;background:${badgeColor};color:#fff;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase">${escapeHtml(statusText)}</span></div>
                    <h1 style="margin:14px 0 0;font-size:25px;line-height:1.2;color:#122033">${escapeHtml(title)}</h1>
                    ${subtitle ? `<div style="margin-top:8px;color:#52657b;font-size:15px;line-height:1.45">${escapeHtml(subtitle)}</div>` : ""}
                    <div style="margin-top:10px;color:#1769e0;font-size:14px;font-weight:700">${escapeHtml(srnumber)}</div>
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin-top:20px;border-top:1px solid #e2e9f0">${rows}</table>
                    ${response}${next}${button}
                    <div style="margin-top:26px;padding-top:16px;border-top:1px solid #e2e9f0;color:#7b8ba0;font-size:12px;line-height:1.5">Monitored automatically through NYC311 email updates.</div>
                  </td></tr>
                </table>
              </td></tr></table>
            </body></html>`;
          }

          function updateHtmlBody(forward) {
            const srnumber = cleanHeader(forward.srnumber);
            const title = forward.request_type && forward.request_subtype
              ? `${forward.request_type} — ${forward.request_subtype}`
              : forward.request_type || forward.request_subtype || "NYC311 request";
            const agency = forward.agency_name
              ? `${forward.agency_name}${forward.agency_acronym ? ` (${forward.agency_acronym})` : ""}`
              : "";
            return emailShell({
              eyebrow: "NYC311 status update",
              status: forward.event_kind || "Updated",
              srnumber,
              title,
              subtitle: forward.location,
              rows: [
                detailRow("Agency", agency),
                detailRow("Submitted", formatEastern(forward.submitted_at)),
                detailRow("Email received", formatEastern(forward.received_at)),
              ].join(""),
              sectionTitle: "Agency response",
              sectionBody: forward.response_text,
              nextUpdate: forward.next_update_text,
              portalUrl: `https://portal.311.nyc.gov/sr-details/?srnum=${encodeURIComponent(srnumber)}`,
            });
          }

          function registeredAlias(recipient, forward) {
            const domain = requireEnvironment("FORWARD_DOMAIN").toLowerCase();
            const address = String(recipient || "").trim().toLowerCase();
            if (address !== String(forward && forward.recipient_address || "")
              .trim().toLowerCase()) return null;
            const match = address.match(
              new RegExp(`^r(\\d{8})-[a-z0-9_-]+@${domain
                .replace(/[.*+?^${}()|[\\]\\\\]/g, "\\$&")}$`),
            );
            if (!match) return null;
            return address;
          }

          function textBody(forward) {
            const lines = [
              `${cleanHeader(forward.event_kind, "Update")} for ${cleanHeader(forward.srnumber)}`,
              "",
              forward.request_type && forward.request_subtype
                ? `${forward.request_type} — ${forward.request_subtype}`
                : forward.request_type || forward.request_subtype,
              forward.location,
              forward.agency_name
                ? `Agency: ${forward.agency_name}${forward.agency_acronym
                    ? ` (${forward.agency_acronym})`
                    : ""}`
                : null,
              forward.submitted_at
                ? `Submitted: ${formatEastern(forward.submitted_at)}`
                : null,
              forward.received_at
                ? `Email received: ${formatEastern(forward.received_at)}`
                : null,
              "",
              forward.response_text,
              forward.next_update_text
                ? `\nNext update: ${forward.next_update_text}`
                : null,
              "",
              "This is an immediate copy received through NYC311 email monitoring.",
            ];
            return lines.filter((line) => line !== null && line !== undefined)
              .join("\n");
          }

          function forwardingDestinations(scopeType, scopeId) {
            const destinations = [requireEnvironment("FORWARD_TO_EMAIL")];
            if (scopeType === "bid" && Number(scopeId) === 68) {
              destinations.push(requireEnvironment("HUDSON_FORWARD_TO_EMAIL"));
            }
            return [...new Map(destinations.map((address) => [
              String(address).trim().toLowerCase(),
              String(address).trim(),
            ])).values()];
          }

          async function forwardPilotUpdate(recipient, payload) {
            if (!payload || payload.duplicate || !payload.forward) return false;
            const alias = registeredAlias(recipient, payload.forward);
            if (!alias) return false;
            const forward = payload.forward;
            const srnumber = cleanHeader(forward.srnumber, "NYC311 request");
            const eventKind = cleanHeader(forward.event_kind, "Updated");
            const subject = `NYC311 ${eventKind} · ${srnumber}`;
            const visibleSender = `${srnumber}@${requireEnvironment("FORWARD_DOMAIN")}`;
            await ses.send(new SendEmailCommand({
              FromEmailAddress: `NYC311 ${srnumber} <${visibleSender}>`,
              Destination: {
                ToAddresses: forwardingDestinations(
                  forward.scope_type,
                  forward.scope_id,
                ),
              },
              Content: {
                Simple: {
                  Subject: { Data: subject, Charset: "UTF-8" },
                  Body: {
                    Text: { Data: textBody(forward), Charset: "UTF-8" },
                    Html: { Data: updateHtmlBody(forward), Charset: "UTF-8" },
                  },
                },
              },
            }));
            console.log(JSON.stringify({
              event: "pilot_update_forwarded",
              messageId: payload.event_id,
              srnumber,
              alias,
              visibleSender,
            }));
            return true;
          }

          function safeEqualHex(left, right) {
            if (!/^[a-f0-9]{64}$/i.test(String(left || ""))
                || !/^[a-f0-9]{64}$/i.test(String(right || ""))) return false;
            return crypto.timingSafeEqual(
              Buffer.from(left, "hex"),
              Buffer.from(right, "hex"),
            );
          }

          async function sendInitialRequest(event) {
            const headers = Object.fromEntries(
              Object.entries(event.headers || {})
                .map(([key, value]) => [key.toLowerCase(), value]),
            );
            const timestamp = headers["x-nyc311-alert-timestamp"];
            const supplied = String(headers["x-nyc311-alert-signature"] || "")
              .replace(/^v1=/, "");
            const body = event.isBase64Encoded
              ? Buffer.from(event.body || "", "base64").toString("utf8")
              : String(event.body || "");
            const age = Math.abs(Date.now() / 1000 - Number(timestamp));
            const expected = crypto.createHmac(
              "sha256",
              requireEnvironment("WEBHOOK_SECRET"),
            ).update(`v1\n${timestamp}\n${body}`, "utf8").digest("hex");
            if (!Number.isFinite(age) || age > 300 || !safeEqualHex(supplied, expected)) {
              return { statusCode: 401, body: JSON.stringify({ error: "unauthorized" }) };
            }
            let request;
            try {
              request = JSON.parse(body);
            } catch {
              return { statusCode: 400, body: JSON.stringify({ error: "invalid_json" }) };
            }
            const srnumber = cleanHeader(request.srnumber);
            if (request.kind !== "initial_request" || !/^311-\d{8}$/.test(srnumber)) {
              return { statusCode: 400, body: JSON.stringify({ error: "invalid_request" }) };
            }
            const lines = [
              `New ${cleanHeader(request.scope_label, "monitored")} request · ${srnumber}`,
              "",
              cleanHeader(request.problem),
              cleanHeader(request.problem_details),
              cleanHeader(request.additional_details),
              cleanHeader(request.address),
              request.status ? `Status: ${cleanHeader(request.status)}` : null,
              request.submitted_at
                ? `Submitted: ${formatEastern(request.submitted_at)}`
                : null,
              request.updated_at
                ? `Updated: ${formatEastern(request.updated_at)}`
                : null,
              request.closed_at
                ? `Closed: ${formatEastern(request.closed_at)}`
                : null,
              request.next_update ? `Next update: ${cleanHeader(request.next_update)}` : null,
              "",
              cleanHeader(request.portal_url),
            ].filter(Boolean);
            const initialHtml = emailShell({
              eyebrow: `${cleanHeader(request.scope_label, "NYC311")} · New request`,
              status: request.status || "New",
              srnumber,
              title: request.problem || "NYC311 request",
              subtitle: request.address,
              rows: [
                detailRow("Submitted", formatEastern(request.submitted_at)),
                detailRow("Updated", formatEastern(request.updated_at)),
                detailRow("Closed", formatEastern(request.closed_at)),
              ].join(""),
              sectionTitle: "Submitted details",
              sectionBody: [
                request.problem_details,
                request.additional_details,
              ].filter(Boolean).join("\n\n"),
              nextUpdate: request.next_update,
              portalUrl: request.portal_url,
            });
            const visibleSender = `${srnumber}@${requireEnvironment("FORWARD_DOMAIN")}`;
            await ses.send(new SendEmailCommand({
              FromEmailAddress: `NYC311 ${srnumber} <${visibleSender}>`,
              Destination: {
                ToAddresses: forwardingDestinations(
                  request.scope_type,
                  request.scope_id,
                ),
              },
              Content: {
                Simple: {
                  Subject: {
                    Data: `New ${cleanHeader(request.scope_label, "monitored")} NYC311 request · ${srnumber}`,
                    Charset: "UTF-8",
                  },
                  Body: {
                    Text: { Data: lines.join("\n"), Charset: "UTF-8" },
                    Html: { Data: initialHtml, Charset: "UTF-8" },
                  },
                },
              },
            }));
            console.log(JSON.stringify({ event: "initial_request_forwarded", srnumber }));
            return { statusCode: 200, body: JSON.stringify({ sent: true }) };
          }

          async function deliver(record) {
            if (!record || record.eventSource !== "aws:ses" || !record.ses) {
              throw new Error("Unexpected event: expected an AWS SES record");
            }

            const bucket = requireEnvironment("RAW_EMAIL_BUCKET");
            const prefix = process.env.RAW_EMAIL_PREFIX || "";
            const webhookUrl = requireEnvironment("WEBHOOK_URL");
            const secret = requireEnvironment("WEBHOOK_SECRET");
            if (!webhookUrl.startsWith("https://")) {
              throw new Error("WEBHOOK_URL must use HTTPS");
            }

            const mail = record.ses.mail || {};
            const receipt = record.ses.receipt || {};
            const messageId = mail.messageId;
            if (!messageId) {
              throw new Error("SES event is missing mail.messageId");
            }
            const recipient =
              (receipt.recipients && receipt.recipients[0]) ||
              (mail.destination && mail.destination[0]) ||
              "";
            if (/[\r\n]/.test(recipient)) {
              throw new Error("SES recipient contains invalid header characters");
            }

            const key = `${prefix}${messageId}`;
            const object = await s3.send(
              new GetObjectCommand({ Bucket: bucket, Key: key }),
            );
            const raw = Buffer.from(await object.Body.transformToByteArray());
            const timestamp = Math.floor(Date.now() / 1000).toString();
            const metadata = Buffer.from(
              JSON.stringify({
                version: 1,
                messageId,
                bucket,
                key,
                receivedAt: mail.timestamp || null,
                source: mail.source || null,
                destinations: mail.destination || [],
                recipients: receipt.recipients || [],
                verdicts: verdicts(receipt),
              }),
              "utf8",
            ).toString("base64url");

            // Primary authentication covers the exact raw MIME bytes.
            const bodySignature = crypto
              .createHmac("sha256", secret)
              .update(raw)
              .digest("hex");
            // A second signature binds the delivery timestamp and SES metadata
            // to that authenticated body without changing the raw-body contract.
            const envelopeSignature = crypto
              .createHmac("sha256", secret)
              .update(
                `v1\n${timestamp}\n${metadata}\n${bodySignature}`,
                "utf8",
              )
              .digest("hex");

            const response = await fetch(webhookUrl, {
              method: "POST",
              redirect: "error",
              signal: AbortSignal.timeout(15000),
              headers: {
                "content-type": "message/rfc822",
                "x-nyc311-email-version": "1",
                "x-nyc311-email-timestamp": timestamp,
                "x-nyc311-email-metadata": metadata,
                "x-nyc311-email-signature": `v1=${bodySignature}`,
                "x-nyc311-email-envelope-signature":
                  `v1=${envelopeSignature}`,
                ...(recipient ? { "x-nyc311-recipient": recipient } : {}),
              },
              body: raw,
            });

            if (!response.ok) {
              const responseText = (await response.text()).slice(0, 500);
              throw new Error(
                `Webhook rejected ${messageId}: ${response.status} ${responseText}`,
              );
            }

            let payload;
            try {
              payload = await response.json();
            } catch {
              throw new Error(`Webhook returned invalid JSON for ${messageId}`);
            }
            const forwarded = await forwardPilotUpdate(recipient, payload);

            console.log(
              JSON.stringify({
                event: "inbound_email_delivered",
                messageId,
                key,
                status: response.status,
                bytes: raw.length,
                forwarded,
              }),
            );
          }

          exports.handler = async (event) => {
            if (event && event.requestContext && event.requestContext.http) {
              return sendInitialRequest(event);
            }
            const records = Array.isArray(event && event.Records)
              ? event.Records
              : [];
            if (records.length === 0) {
              throw new Error("SES event contained no records");
            }
            await Promise.all(records.map(deliver));
            return { delivered: records.length };
          };

  DeliveryLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      InvokeMode: BUFFERED
      TargetFunctionArn: !GetAtt DeliveryLambda.Arn

  AllowPublicInitialAlertInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref DeliveryLambda
      FunctionUrlAuthType: NONE
      Principal: "*"

  AllowPublicInitialAlertFunctionInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DeliveryLambda
      InvokedViaFunctionUrl: true
      Principal: "*"

  DeliveryLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DeliveryLambda}'
      RetentionInDays: 30

  DeliveryLambdaFailureHandling:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref DeliveryLambda
      Qualifier: $LATEST
      MaximumEventAgeInSeconds: 21600
      MaximumRetryAttempts: 2
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt FailedDeliveryQueue.Arn

  AllowSesInvokeDeliveryLambda:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DeliveryLambda
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${ReceiptRuleSetName}:receipt-rule/${ReceiptRuleName}'

  ReceiptRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: !Ref ReceiptRuleSetName

  ReceiptRule:
    Type: AWS::SES::ReceiptRule
    DependsOn:
      - AllowSesInvokeDeliveryLambda
      - DeliveryLambdaFailureHandling
      - DeliveryLambdaLogGroup
      - InboundDomainIdentity
      - RawEmailBucketPolicy
    Properties:
      RuleSetName: !Ref ReceiptRuleSet
      Rule:
        Name: !Ref ReceiptRuleName
        Enabled: true
        ScanEnabled: true
        TlsPolicy: Optional
        Recipients:
          - !Ref RecipientDomain
        Actions:
          - S3Action:
              BucketName: !Ref RawEmailBucket
              ObjectKeyPrefix: !Ref ObjectKeyPrefix
          - LambdaAction:
              FunctionArn: !GetAtt DeliveryLambda.Arn
              InvocationType: Event
          - StopAction:
              Scope: RuleSet

Outputs:
  RecipientDomain:
    Description: Catch-all domain accepted by the SES receipt rule.
    Value: !Ref RecipientDomain

  ExamplePilotAddress:
    Description: >
      Example only. No mailbox or alias resource is required; every local part
      at the recipient domain reaches this rule.
    Value: !Sub 'pilot-001@${RecipientDomain}'

  InboundMxTarget:
    Description: Cloudflare MX target. Configure it on the recipient subdomain at priority 10.
    Value: !Sub 'inbound-smtp.${AWS::Region}.amazonaws.com'

  DkimCnameName1:
    Description: First Cloudflare CNAME name required to verify the inbound SES identity.
    Value: !GetAtt InboundDomainIdentity.DkimDNSTokenName1

  DkimCnameValue1:
    Description: First Cloudflare CNAME target required to verify the inbound SES identity.
    Value: !GetAtt InboundDomainIdentity.DkimDNSTokenValue1

  DkimCnameName2:
    Description: Second Cloudflare CNAME name required to verify the inbound SES identity.
    Value: !GetAtt InboundDomainIdentity.DkimDNSTokenName2

  DkimCnameValue2:
    Description: Second Cloudflare CNAME target required to verify the inbound SES identity.
    Value: !GetAtt InboundDomainIdentity.DkimDNSTokenValue2

  DkimCnameName3:
    Description: Third Cloudflare CNAME name required to verify the inbound SES identity.
    Value: !GetAtt InboundDomainIdentity.DkimDNSTokenName3

  DkimCnameValue3:
    Description: Third Cloudflare CNAME target required to verify the inbound SES identity.
    Value: !GetAtt InboundDomainIdentity.DkimDNSTokenValue3

  ReceiptRuleSetName:
    Description: Activate this SES receipt rule set after checking for an existing active set.
    Value: !Ref ReceiptRuleSet

  RawEmailBucketName:
    Description: Private, retained source of truth for original MIME messages.
    Value: !Ref RawEmailBucket

  FailedDeliveryQueueUrl:
    Description: Asynchronous Lambda failures that exhausted automatic retries.
    Value: !Ref FailedDeliveryQueue

  DeliveryLambdaLogGroup:
    Value: !Ref DeliveryLambdaLogGroup

  InitialEmailEndpoint:
    Description: HMAC-authenticated endpoint used by the collector for initial request emails.
    Value: !GetAtt DeliveryLambdaUrl.FunctionUrl
